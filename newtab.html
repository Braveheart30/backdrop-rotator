<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body class="clock-corner">
  <div id="bgA" class="bg"></div>
  <div id="bgB" class="bg"></div>

  <header id="bar">
    <div id="clock">
      <div id="time"></div>
      <div id="date"></div>
    </div>
    <form id="search">
      <input id="q" type="search" placeholder="Search the web" autocomplete="off" aria-label="Search the web">
    </form>
  </header>

  <div id="empty">
    <h1>No sketches yet</h1>
    <p>Pick a few minimal sketches, press Surprise me, or ask Claude to draw something. Every new tab will open on one of them.</p>
    <button id="addBtn">Get started</button>
  </div>

  <nav id="controls">
    <button id="nextBtn" title="Next sketch" aria-label="Next sketch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="settingsBtn" title="Settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </nav>

  <script src="js/bridge.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sketch.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
